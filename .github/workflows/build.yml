name: Build and test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Core regression tests
        run: dotnet run --project tests/CoreParity -c Release
      - name: Publish app
        run: dotnet publish src/FluentSakhrDictionary/FluentSakhrDictionary.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained false -p:WindowsAppSDKSelfContained=true -o publish
      - name: Build installer from fresh app
        shell: pwsh
        run: ./verification/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SakhrDictionaryRevive-build
          path: |
            publish/
            setup/
