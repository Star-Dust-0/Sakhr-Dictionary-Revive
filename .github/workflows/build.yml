name: Build and test
on:
  push:
    branches: [main, release-ready]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Core regression tests
        run: dotnet run --project tests/CoreParity -c Release
      - name: Restore final bundled-runtime packaging
        shell: pwsh
        run: ./verification/package-self-contained.ps1
      - name: Isolated portable and per-user installation test
        shell: pwsh
        run: ./verification/test-self-contained.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SakhrDictionaryRevive-build
          path: |
            out/
            SakhrDictionaryRevive-v1.0.2-portable-win-x64.zip
            evidence/
